  <style>
  /* Fade animation (aplica al grid completo) */
  @keyframes fadeCycle {
    0%, 100% { opacity: 0; }
    10%, 90% { opacity: 1; }
  }
  
  /* Contenedor del grid (mobile por defecto: 3 columnas) */
  .lvlx-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.5rem 2rem;
    align-items: start;
    justify-items: center;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1rem;
    animation: fadeCycle 8s ease-in-out infinite;
  }
  
/* Item container: columna centrada */
.lvlx-item {
  display: flex;
  flex-direction: column;
  align-items: center; /* centra texto e imagen */
  justify-content: center;
  text-align: center;
}

.lvlx-item p {
  margin: 0 0 0.5rem;
  font-weight: 700;
  text-transform: uppercase;
  font-size: 0.86rem;
  letter-spacing: 0.03em;
  white-space: nowrap;
  font-family: 'Gobold';
}

.lvlx-item img {
  display: block;
  width: clamp(100px, 6vw, 200px);
  height: auto;
  max-width: none;
  transition: transform 200ms ease, opacity 200ms ease;
}

  /* Hover */
  .lvlx-item a { display: inline-block; cursor: pointer; }
  .lvlx-item a:hover img { transform: scale(1.08); }
  
  /* --- Desktop explicit placement: columnas externas vacías + 3 columnas centrales fijas --- */
  @media (min-width: 768px) {
    .lvlx-grid {
      grid-template-columns: 1fr 140px 140px 140px 1fr;
    }
  
    /* Row 1 */
    .item-nonexistence  { grid-column: 1; grid-row: 1; }
    .item-realities     { grid-column: 3; grid-row: 1; }
    .item-dimensions    { grid-column: 5; grid-row: 1; }
  
    /* Row 2 */
    .item-universes     { grid-column: 2; grid-row: 2; }
    .item-galaxies      { grid-column: 4; grid-row: 2; }
    .item-systems       { grid-column: 6; grid-row: 2; }
  
    /* Row 3 */
    .item-planets       { grid-column: 1; grid-row: 3; }
    .item-species       { grid-column: 3; grid-row: 3; }
    .item-variants      { grid-column: 5; grid-row: 3; }
  
    /* Row 4 */
    .item-liminal       { grid-column: 2; grid-row: 4; }
    .item-anomalies     { grid-column: 4; grid-row: 4; }
    .item-individuals   { grid-column: 6; grid-row: 4; }
  }
  </style>
