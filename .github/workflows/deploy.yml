name: Deploy to Cloud Run

on:
  push:
    branches:
      - docker

env:
  PROJECT_ID: noxistence-site-v1
  SERVICE_NAME: noxistence-site
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'write' # Needed to push to GitHub Container Registry and manage visibility

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Set repository name to lowercase
        id: string
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Debug package name
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Lowercase: ${{ steps.string.outputs.lowercase }}"
          echo "Package will be: ghcr.io/${{ steps.string.outputs.lowercase }}"

      - name: Build and push Docker image to GHCR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}:${{ github.sha }}
            ghcr.io/${{ steps.string.outputs.lowercase }}:latest
          metadata: |
            labels=org.opencontainers.image.source=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        if: success()
        run: |
          PACKAGE_NAME="${{ steps.string.outputs.lowercase }}"
          OWNER=$(echo "$PACKAGE_NAME" | cut -d'/' -f1)
          REPO_NAME=$(echo "$PACKAGE_NAME" | cut -d'/' -f2)
          
          echo "Making package public: $PACKAGE_NAME"
          
          # Use PAT if available, otherwise use GITHUB_TOKEN
          TOKEN="${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}"
          
          # Try organization endpoint first (most common case)
          if gh api -X PATCH "/orgs/$OWNER/packages/container/$REPO_NAME" -f visibility=public 2>/dev/null; then
            echo "✅ Package made public via organization endpoint"
          # Try user endpoint as fallback
          elif gh api -X PATCH "/user/packages/container/$REPO_NAME" -f visibility=public 2>/dev/null; then
            echo "✅ Package made public via user endpoint"
          else
            echo "⚠️  Warning: Could not automatically make package public."
            echo "Please make it public manually at: https://github.com/${{ github.repository }}?tab=packages"
            echo "Or run: gh api -X PATCH /orgs/$OWNER/packages/container/$REPO_NAME -f visibility=public"
          fi
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloud Run from GHCR
        if: success()
        run: |
          IMAGE_TAG="ghcr.io/${{ steps.string.outputs.lowercase }}:${{ github.sha }}"
          echo "Deploying image: $IMAGE_TAG"
          
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_TAG" \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet
          
          if [ $? -eq 0 ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
            exit 1
          fi