name: Deploy to Cloud Run

on:
  push:
    branches:
      - docker

env:
  PROJECT_ID: noxistence-site-v1
  SERVICE_NAME: noxistence-site
  REGION: us-central1
  AR_REPOSITORY: ghcr-remote
  AR_LOCATION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'write' # Needed to push to GitHub Container Registry and manage visibility

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Set repository name to lowercase
        id: string
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Debug authentication info
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Actor: ${{ github.actor }}"
          echo "Lowercase repo: ${{ steps.string.outputs.lowercase }}"
          echo "Package will be: ghcr.io/${{ steps.string.outputs.lowercase }}"
          echo "Token exists: ${{ secrets.GHCR_TOKEN != '' && 'YES' || 'NO' }}"

      - name: Verify GHCR token
        run: |
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "❌ ERROR: GHCR_TOKEN secret is not set or is empty"
            echo "Please create a Personal Access Token with 'write:packages' scope"
            echo "and add it as a secret named 'GHCR_TOKEN' in your repository settings"
            exit 1
          fi
          echo "✅ GHCR_TOKEN secret exists"
          
          # Test token by trying to authenticate
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin || {
            echo "❌ ERROR: Failed to authenticate with GHCR"
            echo "Please verify that:"
            echo "1. The token has 'write:packages' scope"
            echo "2. The token is not expired"
            echo "3. The username matches your GitHub username: ${{ github.repository_owner }}"
            exit 1
          }
          echo "✅ Successfully authenticated with GHCR"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image to GHCR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}:${{ github.sha }}
            ghcr.io/${{ steps.string.outputs.lowercase }}:latest
          metadata: |
            labels=org.opencontainers.image.source=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        if: success()
        run: |
          PACKAGE_NAME="${{ steps.string.outputs.lowercase }}"
          OWNER=$(echo "$PACKAGE_NAME" | cut -d'/' -f1)
          REPO_NAME=$(echo "$PACKAGE_NAME" | cut -d'/' -f2)
          
          echo "Making package public: $PACKAGE_NAME"
          echo "Owner: $OWNER"
          echo "Repo name: $REPO_NAME"
          
          # For user accounts (not organizations), use user endpoint
          if gh api -X PATCH "/user/packages/container/$REPO_NAME" -f visibility=public 2>&1; then
            echo "✅ Package made public via user endpoint"
          else
            echo "⚠️  Warning: Could not automatically make package public."
            echo "Please make it public manually at: https://github.com/${{ github.repository }}?tab=packages"
            echo "Or run: gh api -X PATCH /user/packages/container/$REPO_NAME -f visibility=public"
          fi
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Artifact Registry repository
        run: |
          echo "Setting up Artifact Registry repository..."
          
          # Enable Artifact Registry API if not already enabled
          gcloud services enable artifactregistry.googleapis.com --project=${{ env.PROJECT_ID }} || true
          
          # Check if repository exists, create if it doesn't
          if gcloud artifacts repositories describe ${{ env.AR_REPOSITORY }} \
            --location=${{ env.AR_LOCATION }} \
            --project=${{ env.PROJECT_ID }} 2>/dev/null; then
            echo "✅ Artifact Registry repository already exists"
          else
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create ${{ env.AR_REPOSITORY }} \
              --repository-format=docker \
              --location=${{ env.AR_LOCATION }} \
              --project=${{ env.PROJECT_ID }} \
              --description="Repository for NOXISTENCE site images from GHCR"
          fi

      - name: Authenticate to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.AR_LOCATION }}-docker.pkg.dev --quiet

      - name: Pull from GHCR and push to Artifact Registry
        if: success()
        run: |
          GHCR_IMAGE="ghcr.io/${{ steps.string.outputs.lowercase }}:${{ github.sha }}"
          AR_IMAGE="${{ env.AR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/noxistence-site:${{ github.sha }}"
          
          echo "Pulling image from GHCR: $GHCR_IMAGE"
          docker pull "$GHCR_IMAGE"
          
          echo "Tagging image for Artifact Registry: $AR_IMAGE"
          docker tag "$GHCR_IMAGE" "$AR_IMAGE"
          
          echo "Pushing image to Artifact Registry..."
          docker push "$AR_IMAGE"
          
          echo "✅ Image successfully pushed to Artifact Registry"

      - name: Deploy to Cloud Run from Artifact Registry
        if: success()
        run: |
          AR_IMAGE="${{ env.AR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/noxistence-site:${{ github.sha }}"
          
          echo "Deploying image: $AR_IMAGE"
          
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$AR_IMAGE" \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet
          
          if [ $? -eq 0 ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
            exit 1
          fi

      - name: Cleanup old images from Artifact Registry
        if: success()
        run: |
          echo "🧹 Cleaning up old images from Artifact Registry..."
          echo "Keeping only the last 3 images to minimize storage costs"
          
          REPO_PATH="${{ env.AR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/noxistence-site"
          
          # Get all image versions sorted by creation time (newest first)
          IMAGE_VERSIONS=$(gcloud artifacts docker images list "$REPO_PATH" \
            --sort-by=~CREATE_TIME \
            --format="value(version)" \
            --project=${{ env.PROJECT_ID }} 2>/dev/null || echo "")
          
          if [ -z "$IMAGE_VERSIONS" ]; then
            echo "ℹ️  No images found to clean up"
            exit 0
          fi
          
          # Count total images
          TOTAL=$(echo "$IMAGE_VERSIONS" | grep -v '^$' | wc -l)
          echo "📊 Total images found: $TOTAL"
          
          if [ "$TOTAL" -le 3 ]; then
            echo "✅ Only $TOTAL image(s) found, keeping all (limit is 3)"
            exit 0
          fi
          
          # Get images to delete (skip first 3, delete the rest)
          IMAGES_TO_DELETE=$(echo "$IMAGE_VERSIONS" | grep -v '^$' | tail -n +4)
          COUNT_TO_DELETE=$(echo "$IMAGES_TO_DELETE" | grep -v '^$' | wc -l)
          
          echo "🗑️  Deleting $COUNT_TO_DELETE old image(s)..."
          
          echo "$IMAGES_TO_DELETE" | while read -r VERSION; do
            if [ -n "$VERSION" ]; then
              echo "  Deleting: $VERSION"
              gcloud artifacts docker images delete "$REPO_PATH@$VERSION" \
                --quiet \
                --project=${{ env.PROJECT_ID }} 2>/dev/null || echo "    ⚠️  Failed to delete $VERSION (may already be deleted)"
            fi
          done
          
          echo "✅ Cleanup completed. Keeping only the last 3 images."