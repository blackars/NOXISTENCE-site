name: Deploy to Cloud Run

on:
  push:
    branches:
      - docker

env:
  PROJECT_ID: noxistence-site-v1
  SERVICE_NAME: noxistence-site
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Enable Cloud Build API
        run: gcloud services enable cloudbuild.googleapis.com --project ${{ env.PROJECT_ID }}

      - name: Build and Deploy to Cloud Run from Source
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet